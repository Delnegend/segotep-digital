[package]
name = "segotep-digital"
version = "1.1.6"
edition = "2024"
authors = ["Delnegend <kiennguyen19323@gmail.com>"]
description = "Cross-platform driver and service for Segotep Ice Moon / Digital series AIO CPU coolers"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
sysinfo = "0.39.6"
clap = { version = "4.5.31", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ctrlc = "3.5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
