[package]
name = "segotep-digital"
version = "0.1.0"
edition = "2024"
authors = ["Delnegend <kiennguyen19323@gmail.com>"]
description = "Cross-platform driver and service for Segotep Ice Moon / Digital series AIO CPU coolers"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = "2.6.6"
sysinfo = "0.33.1"
clap = { version = "4.5.31", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
ctrlc = "3.5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
