[package]
name = "segotep-digital"
version = "0.1.0"
edition = "2024"
authors = ["Delnegend <kiennguyen19323@gmail.com>"]
description = "Cross-platform driver and service for Segotep Ice Moon / Digital series AIO CPU coolers"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
sysinfo = "0.33.1"
clap = { version = "4.5.31", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ctrlc = "3.5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
unreadable_literal = "allow"
