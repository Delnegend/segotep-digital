name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
# The gate below is stronger than the old PR flow: it needs all of CI
# green, where the PR only required `Check`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rebuild this existing tag instead of shipping a new version. Leave empty for a normal release."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BINARY_NAME: segotep-digital

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # Rebuild path: an explicit tag means ship exactly that, no bump.
          if [ -n "$INPUT_REF" ]; then
            echo "Rebuilding existing tag $INPUT_REF."
            { echo "ref=$INPUT_REF"; echo "version=${INPUT_REF#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing releasable since the last tag: clean exit, no noise.
          if [ "$BUMP" = "none" ]; then
            echo "No version bump needed (current: ${CURRENT:-none})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to re-ship: NEXT must sort after the latest tag.
          # (Catches re-runs after a release already shipped this version.)
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LATEST_TAG" ]; then
            if [ "$NEXT" = "$LATEST_TAG" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
              echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
              exit 1
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          just bump "$NEXT_STRICT"
          git add -u
          if git diff --staged --quiet; then
            # Recovery: the bump already landed on main (a previous run's
            # push succeeded but tagging failed, or the old PR flow merged
            # it). Tag the existing commit and ship it.
            MANIFEST_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            if [ "v$MANIFEST_VER" != "$NEXT" ]; then
              echo "::error::bump produced no change, and manifest ($MANIFEST_VER) disagrees with calculated $NEXT_STRICT."
              exit 1
            fi
            echo "Manifest already at $NEXT; tagging the existing commit."
          else
            git commit -m "chore(release): ${NEXT}"
            # Push the commit first: if the tag push fails, main still has
            # the bump and the next run recovers via the branch above.
            git push origin HEAD:main
          fi
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          { echo "ref=$NEXT"; echo "version=$NEXT_STRICT"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cross

      - name: Build Binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cross build --release --target "$TARGET"

      - name: Package Release Bundle
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          base="${BINARY_NAME}-v${VERSION}-linux-${ARCH}"
          mkdir -p "$base"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$base/"
          cp udev/99-segotep.rules "$base/"
          cp systemd/segotep-digital.service "$base/"
          cp README.md "$base/"
          tar -cJf "${base}.tar.xz" "$base"
          rm -rf "$base"
          ls -lh "${base}.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.xz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target "$TARGET"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        env:
          WIX_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\segotep-digital.wxs -arch x64 -d "Version=$env:WIX_VERSION" -o "installer\output\segotep-digital-v$env:WIX_VERSION-windows-x64.msi"

      - name: Package Release Bundle (ZIP)
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $base = "$env:BINARY_NAME-v$env:VERSION-windows-$env:ARCH"
          New-Item -ItemType Directory -Path $base -Force
          Copy-Item "target/$env:TARGET/release/$env:BINARY_NAME.exe" -Destination "$base/"
          Copy-Item "installer/output/*.msi" -Destination "$base/"
          Copy-Item "README.md" -Destination "$base/"
          Copy-Item "LICENSE-MIT" -Destination "$base/"
          Copy-Item "LICENSE-APACHE" -Destination "$base/"
          Compress-Archive -Path "$base/*" -DestinationPath "$base.zip"
          Remove-Item -Recurse -Force $base
          Get-ChildItem "$base.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi
          if-no-files-found: error

  release:
    name: Tag & Release
    needs: [prepare, build-linux, build-windows]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Generate installation notes
        id: notes
        run: |
          cat <<EOF > install-notes.md
          **Linux Installation**
          1. Extract the tarball: \`tar -xJf segotep-digital-v${VERSION}-linux-amd64.tar.xz\`
          2. Copy binary: \`sudo cp segotep-digital /usr/local/bin/\`
          3. Copy udev rule: \`sudo cp 99-segotep.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger\`
          4. Enable service: \`sudo cp segotep-digital.service /etc/systemd/system/ && sudo systemctl enable --now segotep-digital.service\`

          **Windows Installation**
          1. Download the installer \`segotep-digital-v${VERSION}-windows-x64.msi\` and run it (optionally registering the background service).
          2. Or extract the zip archive \`segotep-digital-v${VERSION}-windows-x64.zip\` and run \`segotep-digital.exe\` directly or configure it as a Windows Startup Task / Scheduled Task.
          EOF
          echo "notes=$PWD/install-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.ref }}
          body_path: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.zip
            artifacts/**/*.msi
