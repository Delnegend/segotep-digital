name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
        default: 0.1.0
      create_release:
        description: Push to GitHub Releases
        required: true
        type: boolean
        default: false

env:
  BINARY_NAME: segotep-digital
  VERSION: ${{ inputs.release_version }}

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        env:
          CARGO_PKG_VERSION: ${{ inputs.release_version }}
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Package Release Bundle
        run: |
          base="${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}"
          mkdir -p "$base"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$base/"
          cp udev/99-segotep.rules "$base/"
          cp systemd/segotep-digital.service "$base/"
          cp README.md "$base/"
          tar -cJf "${base}.tar.xz" "$base"
          rm -rf "$base"
          ls -lh "${base}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.xz

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        env:
          CARGO_PKG_VERSION: ${{ inputs.release_version }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\segotep-digital.wxs -arch x64 -d "Version=${{ inputs.release_version }}" -o "installer\output\segotep-digital-v${{ inputs.release_version }}-windows-x64.msi"

      - name: Compute installer SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer\output\*.msi" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          Write-Output "Installer: $($installer.Name)"
          Write-Output "SHA256: $hash"
          Write-Output "installer_name=$($installer.Name)" >> $env:GITHUB_ENV
          Write-Output "installer_sha256=$hash" >> $env:GITHUB_ENV

      - name: Package Release Bundle (ZIP)
        shell: pwsh
        run: |
          $base = "${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $base -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" -Destination "$base/"
          Copy-Item "installer/output/*.msi" -Destination "$base/"
          Copy-Item "README.md" -Destination "$base/"
          Copy-Item "LICENSE-MIT" -Destination "$base/"
          Copy-Item "LICENSE-APACHE" -Destination "$base/"
          Compress-Archive -Path "$base/*" -DestinationPath "${base}.zip"
          Remove-Item -Recurse -Force $base
          Get-ChildItem "${base}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi

  release:
    name: Release
    needs: [build-linux, build-windows]
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes from commits since last tag
        id: notes
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD 2>/dev/null | tail -1)..HEAD"
            COMPARE=""
          fi
          echo "Generating notes for range $RANGE"
          TMP="$(mktemp -d)"
          git log --pretty=format:"%s" "$RANGE" > "$TMP/all"
          {
            echo "## What's Changed"
            echo
            for spec in "feat **Features**" "fix **Bug Fixes**" "docs **Documentation**" "ci **CI & Workflows**" "test **Tests**" "refactor **Refactoring**" "perf **Performance**" "chore **Chores**"; do
              type="${spec%% *}"
              grep -E "^${type}(\([^)]*\))?: " "$TMP/all" > "$TMP/items" || continue
              echo "${spec#* }"
              sed -E "s/^${type}(\([^)]*\))?: +/  - /" "$TMP/items"
              echo
            done
            grep -Ev "^[a-z]+(\([^)]*\))?: " "$TMP/all" > "$TMP/other" || true
            if [ -s "$TMP/other" ]; then
              echo "**Other Changes**"
              sed 's/^/  - /' "$TMP/other"
              echo
            fi
            echo "**Linux Installation**"
            echo "1. Extract the tarball: \`tar -xJf segotep-digital-v${VERSION}-linux-amd64.tar.xz\`"
            echo "2. Copy binary: \`sudo cp segotep-digital /usr/local/bin/\`"
            echo "3. Copy udev rule: \`sudo cp 99-segotep.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger\`"
            echo "4. Enable service: \`sudo cp segotep-digital.service /etc/systemd/system/ && sudo systemctl enable --now segotep-digital.service\`"
            echo
            echo "**Windows Installation**"
            echo "1. Install with winget once published: \`winget install Delnegend.SegotepDigital\`"
            echo "2. Or download the installer \`segotep-digital-v${VERSION}-windows-x64.msi\` and run it (optionally registering the background service)."
            echo "3. Or extract the zip archive \`segotep-digital-v${VERSION}-windows-x64.zip\` and run \`segotep-digital.exe\` directly or configure it as a Windows Startup Task / Scheduled Task."
            if [ -n "$COMPARE" ]; then
              echo
              echo "**Full Changelog**: $COMPARE"
            fi
          } > notes.md
          echo "=== draft release notes ==="
          cat notes.md
          echo "notes=$PWD/notes.md" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}
          name: v${{ inputs.release_version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.zip
            artifacts/**/*.msi

      - name: Trigger winget submission
        # Releases created with GITHUB_TOKEN do not fire the `release: published`
        # event, so dispatch the winget-submit workflow explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Submit to WinGet" -f version="${{ inputs.release_version }}"
