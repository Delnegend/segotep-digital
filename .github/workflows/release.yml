name: Release

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BINARY_NAME: segotep-digital

jobs:
  version:
    name: Determine Next Version
    runs-on: ubuntu-slim
    outputs:
      bump: ${{ steps.semver.outputs.bump }}
      version: ${{ steps.semver.outputs.next }}
      plain_version: ${{ steps.semver.outputs.nextStrict }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.plain_version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        env:
          CARGO_PKG_VERSION: ${{ needs.version.outputs.plain_version }}
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Package Release Bundle
        run: |
          base="${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}"
          mkdir -p "$base"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$base/"
          cp udev/99-segotep.rules "$base/"
          cp systemd/segotep-digital.service "$base/"
          cp README.md "$base/"
          tar -cJf "${base}.tar.xz" "$base"
          rm -rf "$base"
          ls -lh "${base}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.xz

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.plain_version }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        env:
          CARGO_PKG_VERSION: ${{ needs.version.outputs.plain_version }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\segotep-digital.wxs -arch x64 -d "Version=${{ needs.version.outputs.plain_version }}" -o "installer\output\segotep-digital-v${{ needs.version.outputs.plain_version }}-windows-x64.msi"

      - name: Package Release Bundle (ZIP)
        shell: pwsh
        run: |
          $base = "${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $base -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" -Destination "$base/"
          Copy-Item "installer/output/*.msi" -Destination "$base/"
          Copy-Item "README.md" -Destination "$base/"
          Copy-Item "LICENSE-MIT" -Destination "$base/"
          Copy-Item "LICENSE-APACHE" -Destination "$base/"
          Compress-Archive -Path "$base/*" -DestinationPath "${base}.zip"
          Remove-Item -Recurse -Force $base
          Get-ChildItem "${base}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi

  release:
    name: Tag & Release
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-slim
    env:
      VERSION: ${{ needs.version.outputs.plain_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate installation notes
        id: notes
        run: |
          cat <<EOF > install-notes.md
          **Linux Installation**
          1. Extract the tarball: \`tar -xJf segotep-digital-v${VERSION}-linux-amd64.tar.xz\`
          2. Copy binary: \`sudo cp segotep-digital /usr/local/bin/\`
          3. Copy udev rule: \`sudo cp 99-segotep.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger\`
          4. Enable service: \`sudo cp segotep-digital.service /etc/systemd/system/ && sudo systemctl enable --now segotep-digital.service\`

          **Windows Installation**
          1. Download the installer \`segotep-digital-v${VERSION}-windows-x64.msi\` and run it (optionally registering the background service).
          2. Or extract the zip archive \`segotep-digital-v${VERSION}-windows-x64.zip\` and run \`segotep-digital.exe\` directly or configure it as a Windows Startup Task / Scheduled Task.
          EOF
          echo "notes=$PWD/install-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.zip
            artifacts/**/*.msi
