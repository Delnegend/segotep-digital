name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release mode / build target"
        required: true
        type: choice
        default: "new-tag"
        options:
          - new-tag  # Bump version -> open PR (merge it, then run target=tag to build)
          - tag      # Tag HEAD if missing -> build & publish release
          - commit   # Test build latest commit -> upload Actions artifacts only (no release)
      ref:
        description: "Custom tag or commit SHA (optional, defaults to latest)"
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (defaults to target: new-tag)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BINARY_NAME: segotep-digital

jobs:
  prepare:
    name: Prepare / Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libusb-1.0-0-dev libudev-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # ------------------------------------------------------------------
      # Mode 1: new-tag (semver -> CI gate -> bump -> open PR for review)
      # ------------------------------------------------------------------
      - name: Calculate Next SemVer
        if: (inputs.target || 'new-tag') == 'new-tag'
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: CI Gate (verify code is green before bumping)
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        run: just check

      - name: Bump package manager version
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          just bump "$NEXT_STRICT"

      - name: Commit and open release PR
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        id: release-pr
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -u
          git diff --staged --quiet && { echo "::error::bump produced no change in package files"; exit 1; }
          git commit -m "chore(release): ${NEXT_TAG}"

          # Branch protection blocks a direct push to main, so open a PR.
          # The owner merges it (status checks run on the PR), then re-runs
          # the workflow with target=tag to tag and publish.
          BRANCH="release/${NEXT_TAG}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          gh pr create --title "chore(release): ${NEXT_TAG}" \
            --body "Automated version bump to \`${NEXT_TAG}\`. Merge this PR, then run the release workflow with \`target=tag\` to build and publish." \
            --head "$BRANCH" --base main

      # -----------------------------------------------------------------------
      # Resolve outputs for the build jobs
      # -----------------------------------------------------------------------
      - name: Resolve outputs
        id: resolve
        env:
          TARGET: ${{ inputs.target || 'new-tag' }}
          INPUT_REF: ${{ inputs.ref }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # new-tag only opens the release PR (branch protection blocks a
          # direct push to main). Merge the PR, then re-run with target=tag.
          if [ "$TARGET" = "new-tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ "$BUMP" = "none" ]; then
              echo "No version bump needed (current: ${CURRENT:-none})."
            else
              echo "Release PR opened; merge it, then re-run with target=tag to build and publish."
            fi
            exit 0
          elif [ "$TARGET" = "tag" ]; then
            if [ -n "$INPUT_REF" ]; then
              # Re-run for an existing tag: build and publish it.
              TAG="$INPUT_REF"
            else
              # Normal path: tag the merged release commit, then build it.
              # The version comes from the manifest on main, which the
              # release PR just bumped.
              MANIFEST_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
              [ -n "$MANIFEST_VER" ] || { echo "::error::No version in Cargo.toml"; exit 1; }
              TAG="v$MANIFEST_VER"
              if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                echo "Tag $TAG already exists; building it."
              else
                git config user.name "github-actions[bot]"
                git config user.email "actions@users.noreply.github.com"
                git tag -a "$TAG" -m "Release $TAG"
                git push origin "refs/tags/$TAG"
              fi
            fi
            { echo "ref=$TAG"; echo "version=${TAG#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          else
            SHA="${INPUT_REF:-$(git rev-parse HEAD)}"
            { echo "ref=$SHA"; echo "version=$SHA"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            echo "Running test build against commit $SHA (will not publish release)"
          fi

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cross

      - name: Build Binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cross build --release --target "$TARGET"

      - name: Package Release Bundle
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          base="${BINARY_NAME}-v${VERSION}-linux-${ARCH}"
          mkdir -p "$base"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$base/"
          cp udev/99-segotep.rules "$base/"
          cp systemd/segotep-digital.service "$base/"
          cp README.md "$base/"
          tar -cJf "${base}.tar.xz" "$base"
          rm -rf "$base"
          ls -lh "${base}.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.xz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target "$TARGET"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        env:
          # A `commit` test build has no release version — it resolves to the
          # commit SHA — and WiX accepts only a four-part or semantic version, so
          # the installer gets a placeholder. Only a real release ships.
          WIX_VERSION: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.version || '0.0.0' }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\segotep-digital.wxs -arch x64 -d "Version=$env:WIX_VERSION" -o "installer\output\segotep-digital-v$env:WIX_VERSION-windows-x64.msi"

      - name: Package Release Bundle (ZIP)
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $base = "$env:BINARY_NAME-v$env:VERSION-windows-$env:ARCH"
          New-Item -ItemType Directory -Path $base -Force
          Copy-Item "target/$env:TARGET/release/$env:BINARY_NAME.exe" -Destination "$base/"
          Copy-Item "installer/output/*.msi" -Destination "$base/"
          Copy-Item "README.md" -Destination "$base/"
          Copy-Item "LICENSE-MIT" -Destination "$base/"
          Copy-Item "LICENSE-APACHE" -Destination "$base/"
          Compress-Archive -Path "$base/*" -DestinationPath "$base.zip"
          Remove-Item -Recurse -Force $base
          Get-ChildItem "$base.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-v${{ env.VERSION }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi
          if-no-files-found: error

  release:
    name: Tag & Release
    needs: [prepare, build-linux, build-windows]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Generate installation notes
        id: notes
        run: |
          cat <<EOF > install-notes.md
          **Linux Installation**
          1. Extract the tarball: \`tar -xJf segotep-digital-v${VERSION}-linux-amd64.tar.xz\`
          2. Copy binary: \`sudo cp segotep-digital /usr/local/bin/\`
          3. Copy udev rule: \`sudo cp 99-segotep.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger\`
          4. Enable service: \`sudo cp segotep-digital.service /etc/systemd/system/ && sudo systemctl enable --now segotep-digital.service\`

          **Windows Installation**
          1. Download the installer \`segotep-digital-v${VERSION}-windows-x64.msi\` and run it (optionally registering the background service).
          2. Or extract the zip archive \`segotep-digital-v${VERSION}-windows-x64.zip\` and run \`segotep-digital.exe\` directly or configure it as a Windows Startup Task / Scheduled Task.
          EOF
          echo "notes=$PWD/install-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.ref }}
          body_path: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.zip
            artifacts/**/*.msi
