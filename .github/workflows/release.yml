name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BINARY_NAME: segotep-digital

jobs:
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cross

      - name: Build Binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cross build --release --target "$TARGET"

      - name: Package artifact
        uses: Delnegend/actions/package-artifact@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
        with:
          name: segotep-digital
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ matrix.target }}
          source: target/${{ matrix.target }}/release/segotep-digital
          extra: udev/99-segotep.rules systemd/segotep-digital.service

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target "$TARGET"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      # WiX takes only numeric x.y.z versions, which a test-build version is
      # not. Resolve the installer version here so the WiX build and the
      # bundle below name the same file in every mode.
      - name: Resolve installer version
        id: installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.publish }}" -eq "true" ? "${{ needs.prepare.outputs.version }}" : "0.0.0"
          "version=$version" >> "$env:GITHUB_OUTPUT"

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        env:
          WIX_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\segotep-digital.wxs -arch x64 -d "Version=$env:WIX_VERSION" -o "installer\output\segotep-digital-v$env:WIX_VERSION-windows-x64.msi"

      # The installer keeps its own upload below and ships standalone too.
      - name: Package artifact
        uses: Delnegend/actions/package-artifact@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
        with:
          name: segotep-digital
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ matrix.target }}
          source: target/${{ matrix.target }}/release/segotep-digital
          extra: installer/output/segotep-digital-v${{ steps.installer.outputs.version }}-windows-x64.msi

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi
          if-no-files-found: error

  release:
    name: Tag & Release
    needs: [prepare, build-linux, build-windows]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Generate installation notes
        id: notes
        run: |
          cat <<EOF > install-notes.md
          **Linux Installation**
          1. Extract the tarball for your architecture (\`x86_64-unknown-linux-musl\` on x64, \`aarch64-unknown-linux-musl\` on arm64): \`tar -xJf segotep-digital-${VERSION}-<arch>.tar.xz\`
          2. Copy binary: \`sudo cp segotep-digital /usr/local/bin/\`
          3. Copy udev rule: \`sudo cp 99-segotep.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger\`
          4. Enable service: \`sudo cp segotep-digital.service /etc/systemd/system/ && sudo systemctl enable --now segotep-digital.service\`

          **Windows Installation**
          1. Download the installer \`segotep-digital-v${VERSION}-windows-x64.msi\` and run it (optionally registering the background service).
          2. Or extract the zip archive \`segotep-digital-${VERSION}-x86_64-pc-windows-msvc.zip\` and run \`segotep-digital.exe\` directly or configure it as a Windows Startup Task / Scheduled Task.
          EOF
          echo "notes=$PWD/install-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: Delnegend/actions/publish-release@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          publish: ${{ needs.prepare.outputs.publish }}
          body-path: ${{ steps.notes.outputs.notes }}
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.zip
            artifacts/**/*.msi
