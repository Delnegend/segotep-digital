name: Weekly Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libusb-1.0-0-dev libudev-dev

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Nightly Rust Toolchain (for cooldown dependency resolution)
        uses: dtolnay/rust-toolchain@nightly

      - name: Update dependencies with 2-week cooldown
        run: |
          cargo +nightly update -Zmin-publish-age --config 'registry.global-min-publish-age="14 days"'

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Full test and validation suite
        if: steps.changes.outputs.changed == 'true'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Draft PR body from the dependency diff
        id: prbody
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 - << 'EOF' > /tmp/pr-body.md
          import subprocess
          import sys

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          old_raw = subprocess.check_output(["git", "show", "HEAD:Cargo.lock"]).decode("utf-8")
          with open("Cargo.lock", "r", encoding="utf-8") as f:
              new_raw = f.read()

          old_data = tomllib.loads(old_raw).get("package", [])
          new_data = tomllib.loads(new_raw).get("package", [])

          old_pkgs = {p["name"]: p["version"] for p in old_data}
          new_pkgs = {p["name"]: p["version"] for p in new_data}

          changes = []
          for name, new_ver in sorted(new_pkgs.items()):
              old_ver = old_pkgs.get(name)
              if not old_ver:
                  changes.append(f"- **{name}**: added `{new_ver}`")
              elif old_ver != new_ver:
                  changes.append(f"- **{name}**: `{old_ver}` -> `{new_ver}`")

          for name, old_ver in sorted(old_pkgs.items()):
              if name not in new_pkgs:
                  changes.append(f"- **{name}**: removed (was `{old_ver}`)")

          print("## Dependency changes\n")
          if changes:
              for line in changes:
                  print(line)
          else:
              print("- No version changes detected.")
          print("\n*Generated by the weekly dependency-update workflow with a 2-week cooldown period (RFC 3923). The full test suite and clippy checks passed.*")
          EOF

          {
            echo "body<<EOF"
            cat /tmp/pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR for review
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          body: ${{ steps.prbody.outputs.body }}
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
