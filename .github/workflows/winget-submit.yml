name: Submit to WinGet

# Opens a manifest PR against microsoft/winget-pkgs whenever a release is
# published. Requires the WINGET_TOKEN secret, a PAT from the account that owns
# the winget-pkgs fork (created automatically):
#
#   gh secret set WINGET_TOKEN
#
# Either a classic PAT with the `repo` scope, or a fine-grained PAT with:
#   - Repository access: All repositories   (required: the fork is created at
#     runtime and would not be in an "Only select repositories" list)
#   - Contents: Read and write
#   - Pull requests: Read and write
#
# The workflow downloads the released MSI, computes its SHA256, patches
# winget/Delnegend.SegotepDigital/<version>/...installer.yaml, then forks
# microsoft/winget-pkgs (if needed), pushes the manifests for that version and
# opens the PR. The PR still needs human moderator approval on the winget-pkgs
# side before it is merged.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit (e.g. 1.0.0), without leading 'v'"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Open winget-pkgs PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="${{ inputs.version }}"
          fi
          v="${v#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Verify WINGET_TOKEN is configured
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The WINGET_TOKEN secret is not set. Add it with:"
            echo "::error::  gh secret set WINGET_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify manifests exist
        shell: bash
        run: |
          MANIFEST_DIR="winget/Delnegend.SegotepDigital/${{ steps.version.outputs.version }}"
          if [[ ! -f "$MANIFEST_DIR/Delnegend.SegotepDigital.installer.yaml" ]]; then
            echo "::error::Manifests for version ${{ steps.version.outputs.version }} not found in $MANIFEST_DIR"
            echo "::error::Create winget/Delnegend.SegotepDigital/${{ steps.version.outputs.version }}/ before releasing."
            exit 1
          fi

      - name: Compute installer SHA256 from release asset
        id: hash
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/Delnegend/segotep-digital/releases/download/v${VERSION}/segotep-digital-v${VERSION}-windows-x64.msi"
          curl -fL --retry 3 -o installer.msi "$URL"
          SHA="$(sha256sum installer.msi | cut -d' ' -f1)"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Installer SHA256: ${SHA}"

      - name: Patch InstallerSha256 in the installer manifest
        shell: bash
        run: |
          MANIFEST="winget/Delnegend.SegotepDigital/${{ steps.version.outputs.version }}/Delnegend.SegotepDigital.installer.yaml"
          sed -i "s/InstallerSha256: .*/InstallerSha256: ${{ steps.hash.outputs.sha256 }}/" "$MANIFEST"
          grep "InstallerSha256" "$MANIFEST"

      - name: Clone winget-pkgs and prepare branch
        id: prep
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git clone --depth 1 https://github.com/microsoft/winget-pkgs.git
          if [[ -d "winget-pkgs/manifests/d/Delnegend/SegotepDigital/${VERSION}" ]]; then
            echo "::warning::Version ${VERSION} already exists in microsoft/winget-pkgs; nothing to do."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh repo fork microsoft/winget-pkgs --default-branch-only=false || true
          cd winget-pkgs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "Delnegend.SegotepDigital-${VERSION}"
          echo "branch=Delnegend.SegotepDigital-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "fork_owner=$(gh api user --jq .login)" >> "$GITHUB_OUTPUT"
          if [[ -d "manifests/d/Delnegend/SegotepDigital" ]]; then
            echo "title_prefix=New version" >> "$GITHUB_OUTPUT"
          else
            echo "title_prefix=New package" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy manifests and commit
        if: steps.prep.outputs.branch != ''
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "winget-pkgs/manifests/d/Delnegend/SegotepDigital/${VERSION}"
          cp "winget/Delnegend.SegotepDigital/${VERSION}/"*.yaml "winget-pkgs/manifests/d/Delnegend/SegotepDigital/${VERSION}/"
          cd winget-pkgs
          git add "manifests/d/Delnegend/SegotepDigital/${VERSION}"
          git commit -m "${{ steps.prep.outputs.title_prefix }}: Delnegend.SegotepDigital version ${VERSION}"

      - name: Push branch and open PR
        if: steps.prep.outputs.branch != ''
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREFIX="${{ steps.prep.outputs.title_prefix }}"
          cd winget-pkgs
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.prep.outputs.fork_owner }}/winget-pkgs.git" "HEAD:${{ steps.prep.outputs.branch }}"
          BODY=$(cat <<EOF
          <!-- PR Title Format: "New package: Publisher.Name version X.Y.Z" or "Update: Publisher.Name to X.Y.Z" -->

          ## 📖 Description
          ${PREFIX} for **Segotep Digital** version **${VERSION}** — an open-source, cross-platform driver and background service for Segotep Ice Moon / Digital series AIO CPU coolers with integrated 7-segment digital pump displays.

          - Source: https://github.com/Delnegend/segotep-digital
          - Release: https://github.com/Delnegend/segotep-digital/releases/tag/v${VERSION}
          - Installer: WiX MSI (x64) — installs to Program Files, registers the background service, and adds the binary to PATH
          - \`InstallerSha256\` verified against the published release asset

          ## ✅ Checklist
          <!-- Place an "x" between the brackets to check an item. e.g: [x] -->

          - [ ] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
          - [ ] Linked to an issue (if applicable)
            <!-- Example: Resolves #328283 -->
            - Resolves #[Issue Number]

          ## 📦 Manifest Checklist

          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated manifest locally with \`winget validate --manifest <path>\` ([validation guide](https://github.com/microsoft/winget-pkgs/blob/master/doc/ValidationFailureGuide.md))
          - [ ] Tested manifest locally with \`winget install --manifest <path>\`
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)

          > **Note:** \`<path>\` is the directory containing the manifest you're submitting.
          EOF
          )
          gh pr create --repo microsoft/winget-pkgs \
            --base master \
            --head "${{ steps.prep.outputs.fork_owner }}:${{ steps.prep.outputs.branch }}" \
            --title "${PREFIX}: Delnegend.SegotepDigital version ${VERSION}" \
            --body "$BODY"